# 5개 서비스: django · fastapi · celery · redis · postgres
# 실행: docker compose up --build
# 서비스끼리는 서비스 이름(postgres, redis, fastapi)으로 통신한다.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 DB 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fastapi:
    build: ./ai_service
    env_file: .env
    environment:
      POSE_DEVICE: cpu
    volumes:
      - ./ai_service/models:/app/models:ro   # 학습 산출물(Git 제외)을 읽기 전용으로 연결
    ports:
      - "8001:8001"   # 개발 중 Swagger(/docs) 확인용. 운영에서는 닫아도 된다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8001/health')); sys.exit(0 if d['model_loaded'] else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  django:
    build: ./backend
    env_file: .env
    environment:
      MEDIA_ROOT: /app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - media:/app/media        # 업로드 영상·결과 이미지 (celery와 공유)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: ./backend            # django와 같은 이미지·코드, 실행 명령만 다름
    env_file: .env
    environment:
      MEDIA_ROOT: /app/media
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트에서 실행한 테스트용 카메라 접근
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_started
    restart: unless-stopped

  # (선택) 휴대폰이 없을 때 쓰는 테스트용 가짜 IP Webcam. 필수 5개 서비스에는 포함하지 않는다.
  # 실행: docker compose --profile demo up -d fakecam
  fakecam:
    profiles: ["demo"]
    build: ./backend
    command: python /tools/fake_ipwebcam.py /samples/${FAKECAM_VIDEO:-a02_s07_e01.mp4} --port 8090
    volumes:
      - ./tools:/tools:ro
      - ./samples:/samples:ro
    ports:
      - "8090:8090"

volumes:
  pgdata:
  media:
